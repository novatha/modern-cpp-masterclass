name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'gui/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'GridGuard_win.spec'
      - 'installer_windows.iss'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 networkx scipy matplotlib numpy pyinstaller pillow

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C++20 Woodbury Engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target contingency_n2_woodbury

      - name: Copy binary to build root
        shell: pwsh
        run: |
          if (Test-Path "build\Release\contingency_n2_woodbury.exe") {
              Copy-Item "build\Release\contingency_n2_woodbury.exe" -Destination "build\contingency_n2_woodbury.exe" -Force
          }

      - name: Build Application with PyInstaller
        run: |
          pyinstaller --noconfirm --clean GridGuard_win.spec

      - name: Ensure Extra Files in dist
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "data" "dist\GridGuard\data"
          Copy-Item -Recurse -Force "assets" "dist\GridGuard\assets"
          New-Item -ItemType Directory -Force -Path "dist\GridGuard\build"
          if (Test-Path "build\Release\contingency_n2_woodbury.exe") {
              Copy-Item "build\Release\contingency_n2_woodbury.exe" "dist\GridGuard\build\contingency_n2_woodbury.exe" -Force
              Copy-Item "build\Release\contingency_n2_woodbury.exe" "dist\GridGuard\contingency_n2_woodbury.exe" -Force
          } elseif (Test-Path "build\contingency_n2_woodbury.exe") {
              Copy-Item "build\contingency_n2_woodbury.exe" "dist\GridGuard\build\contingency_n2_woodbury.exe" -Force
              Copy-Item "build\contingency_n2_woodbury.exe" "dist\GridGuard\contingency_n2_woodbury.exe" -Force
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Windows Installer with Inno Setup
        run: |
          iscc installer_windows.iss

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: GridGuard-N2-Windows-Setup-v2.1.1
          path: dist/GridGuard-N2-Windows-Setup-v2.1.1.exe
